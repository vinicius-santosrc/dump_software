<section #chatBody class="messages__chat" *ngIf="conversation?.id">
    <header class="chat__header">
        <div class="chat__user">
            <div class="chat__image-user">
                <img [src]="getConversationAvatar()" />
                <span class="online-dot" *ngIf="isUserOnline(conversation.participants[0])">
                </span>
            </div>
            <div>
                <p>{{ getConversationName() }}</p>
                <span>{{ getConversationUser() }}</span>
            </div>
        </div>

        <div class="chat__actions">
            <button id="call">
                <mat-icon>phone</mat-icon>
            </button>
            <button id="video-call">
                <mat-icon>video_call</mat-icon>
            </button>
            <button id="info">
                <mat-icon>info</mat-icon>
            </button>
        </div>
    </header>

    <div #scrollContainer class="chat__body" style="scroll-behavior: smooth;">
        <div *ngFor="let msg of messages; let i = index" class="message" [class.me]="msg.senderId === current_user?.id">

            @if(msg.senderId != current_user?.id) {
            <img class="message__avatar"
                [src]="getUserById(msg.senderId)?.profilePictureUrl || 'assets/app/media/default-avatar.webp'" />
            }

            <div class="message__content">
                <span *ngIf="isGroup && msg.senderId !== current_user?.id" class="message__name">
                    {{ getUserById(msg.senderId)?.fullName }}
                </span>

                <app-message-renderer [message]="msg" [isMine]="msg.senderId === current_user?.id">
                </app-message-renderer>
                <span class="message__status" *ngIf="i === messages.length - 1 && msg.senderId === current_user?.id">
                    {{ getMessageStatus(msg) }}
                </span>

                <button *ngIf="msg.status === 'error'" (click)="sendMessage()" class="retry-btn">
                    Reenviar
                </button>
            </div>

            @if(msg.senderId == current_user?.id) {
            <img class="message__avatar"
                [src]="getUserById(msg.senderId)?.profilePictureUrl || 'assets/app/media/default-avatar.webp'" alt/>
            }
        </div>
        <div class="typing" *ngIf="typingUsers.size > 0">
            <div class="loader"></div>
        </div>
    </div>

    <div class="chat__input">
        <div class="chat__input-actions">
            <button>＋</button>

        </div>

        <input (input)="onTyping()" (blur)="onStopTyping()" type="text" [(ngModel)]="input" placeholder="Escreva uma mensagem" />

        <button *ngIf="input !== ''"
            (click)="sendMessage()">Enviar</button>

        <div class="chat__input-right" *ngIf="input === ''">
            <button>😊</button>
            <button>👍</button>
        </div>
    </div>
</section>

<section class="no_chat__screen" *ngIf="!conversation?.id">
    <div class="no_chat__content">
        <h2>Selecione uma conversa</h2>
        <p>Selecione um chat para começar a conversar no dump.</p>
    </div>
</section>
