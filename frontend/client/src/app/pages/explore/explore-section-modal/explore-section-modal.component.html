<section class="explore-modal-section">
    <header class="explore-modal-section__header">
        <div>
            <mat-icon>{{ section.icon }}</mat-icon>

            <span>
                <strong>{{ section.title }}</strong>
                <small>{{ section.description }}</small>
            </span>
        </div>

        <button mat-icon-button mat-dialog-close [attr.aria-label]="'EXPLORE.MODAL.CLOSE' | translate">
            <mat-icon>close</mat-icon>
        </button>
    </header>

    <div class="explore-modal-section__rail">
        <button type="button" class="explore-modal-pill">{{ 'EXPLORE.MODAL.FILTERS.RECENT' | translate }}</button>
        <button type="button" class="explore-modal-pill">{{ 'EXPLORE.MODAL.FILTERS.MOST_LIKED' | translate }}</button>
        <button type="button" class="explore-modal-pill">{{ 'EXPLORE.MODAL.FILTERS.VIDEOS_ONLY' | translate }}</button>
        <button type="button" class="explore-modal-pill">{{ 'EXPLORE.MODAL.FILTERS.SMALL_CREATORS' | translate }}</button>
        <button type="button" class="explore-modal-pill">{{ 'EXPLORE.MODAL.FILTERS.NEAR_YOU' | translate }}</button>
    </div>

    <div class="explore-modal-section__grid">
        @for (post of section.posts; track post.id) {
        <button type="button" class="explore-modal-post"
            [style.--post-image]="post.imageUrl ? 'url(' + post.imageUrl + ')' : null" (click)="openQuickReels(post)">

            <span>{{ 'EXPLORE.POST.RELEVANT_SCORE' | translate: { score: post.score } }}</span>
            <strong>{{ post.title }}</strong>
            <small>{{ post.author }} · {{ post.meta }}</small>
        </button>
        }
    </div>
</section>
