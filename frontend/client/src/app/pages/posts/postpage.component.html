@if (isModal) {
<div class="post-modal overlay">

    <div class="post-content">
        <ng-container *ngTemplateOutlet="content"></ng-container>
    </div>

</div>
} @else {
<div class="post-page">
    <ng-container *ngTemplateOutlet="content"></ng-container>
</div>
}

<ng-template #content>

    <div class="media">
       <app-post-media [media]="post.media" />
    </div>

    <div class="info">
        <app-post-header [isModal]="isModal" [user]="post?.user" [caption]="post?.caption" [theme]="isModal ? 'dark' : 'light'" />

        <app-post-action-buttons [post]="post" [theme]="isModal ? 'dark' : 'light'" />

        <app-post-comments [comments]="comments" [theme]="isModal ? 'dark' : 'light'" />

    </div>

    @if (isModal) {
    <button class="close-btn" (click)="close()">✕</button>
    }

</ng-template>
