<div class="video-container" (click)="togglePlay()">

  <video
    #video
    [attr.src]="hasLoaded ? src : null"
    [attr.poster]="thumbnail || null"
    [muted]="isMuted"
    loop
    preload="metadata"
    playsinline
    (timeupdate)="onTimeUpdate()"
  ></video>

  <div class="loading" *ngIf="isLoading && hasLoaded">
    <div class="spinner"></div>
  </div>

  <div class="overlay" *ngIf="isPaused && hasLoaded">
    <span class="play-icon">▶</span>
  </div>

  <div class="controls" *ngIf="hasLoaded">
    <div class="progress">
      <div class="bar" [style.width.%]="progress"></div>
    </div>

    <button mat-icon-button class="mute-btn" (click)="$event.stopPropagation(); toggleMute()">
      <mat-icon>{{ isMuted ? 'volume_off' : 'volume_up' }}</mat-icon>
    </button>
  </div>

</div>
