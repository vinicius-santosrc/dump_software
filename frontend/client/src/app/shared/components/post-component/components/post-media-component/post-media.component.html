<div class="post-media" (pointerup)="handleTap()">

    @if(resolvedMedia.length === 1) {

    @if(resolvedMedia[0].type === 'image') {
    <div class="media-container">

        @if(isLoading) {
        <div class="media-skeleton"></div>
        }

        <img
            loading="lazy"
            [src]="isLoading ? (resolvedMedia[0].thumbnail || resolvedMedia[0].url) : resolvedMedia[0].url"
            alt="Post"
            (load)="onMediaLoad()"
            [class.loaded]="!isLoading"
        />

    </div>
    }

    @if(resolvedMedia[0].type === 'video') {
        @if(!resolvedMedia[0].url && resolvedMedia[0].thumbnail) {
        <div class="media-container media-container--video-placeholder">
            <img
                loading="lazy"
                [src]="resolvedMedia[0].thumbnail"
                alt="Post"
                [class.loaded]="true"
            />

            @if(isLoadingFullMedia) {
            <div class="media-video-loader">
                <app-loader />
            </div>
            }
        </div>
        }
        @else {
        <app-video-dump
            #videoPlayer
            [src]="resolvedMedia[0].url"
            [thumbnail]="resolvedMedia[0].thumbnail || ''"
        />
        }
    }

    } @else if(resolvedMedia.length > 1) {
    <app-post-carousel [media]="resolvedMedia" />
    }

    <div class="like-burst" *ngIf="showLike">❤️</div>
    <div class="like-burst" *ngIf="showDislike">💔</div>

</div>
