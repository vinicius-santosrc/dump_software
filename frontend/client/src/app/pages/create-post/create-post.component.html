<section class="create-post">
    <div class="create-post__inside">
        <div class="create-post__header">
            <h1>Criar nova publicação</h1>
            <button (click)="close()">
                <mat-icon>close</mat-icon>
            </button>
        </div>
        <div 
          class="create-post__drop-files"
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave($event)"
          (drop)="onDrop($event)"
          [class.dragging]="isDragging"
          *ngIf="!files || files.length == 0"
        >
            <input 
              #fileInput 
              type="file" 
              multiple 
              accept="image/*,video/*" 
              hidden 
              (change)="onFileSelected($event)" 
            />

            <img src="/assets/app/media/undraw_upload_cucu.svg" alt />
            <p>Arraste fotos ou vídeos aqui</p>

            <button (click)="fileInput.click()">
                <span>Selecionar do dispositivo</span>
            </button>

            <div *ngIf="files.length > 0" class="preview">
                <p>{{ files.length }} arquivo(s) selecionado(s)</p>
            </div>
        </div>
        <app-create-post-general-component *ngIf="files.length > 0" [files]="files" />
    </div>
</section>
