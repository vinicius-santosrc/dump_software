<div [class]="variant === 'default' ? 'conversation-item' : 'conversation-item-circular'"
  [ngClass]="[variant, selected ? 'selected' : '', getUnreadCount() > 0 ? 'unread' : '']" (click)="onClick()">

  <div class="avatar-wrapper">
    @if(this.convo.participants.length === 2) {
    <app-avatar-item [user]="getConversationUser()" [src]="getConversationAvatar()" [width]="'52px'" [height]="'52px'" />
    }
    @else {
      <app-avatar-item [multipleUsers]="getConversationUser()" [width]="'52px'" [height]="'52px'" />
    }

    <div class="check" *ngIf="selected">
      ✓
    </div>
  </div>

  <!-- DEFAULT -->
  <div *ngIf="variant === 'default'" class="conversation-item__content">

    <div class="top">
      <span class="name">{{ getConversationName() }}</span>
      <span class="time" *ngIf="getUnreadCount() > 0"></span>
    </div>

    <div class="bottom">
      <span class="last">
        <span *ngIf="isTyping()" class="typing">digitando...</span>
        <span *ngIf="!isTyping()">{{ getLastMessage() }}</span>
      </span>

      <span class="unread-indicator" *ngIf="getUnreadCount() > 0" aria-label="Mensagens não lidas">
        <span class="unread-count" *ngIf="getUnreadCount() > 1">
          {{ getUnreadCount() > 99 ? '99+' : getUnreadCount() }}
        </span>
      </span>
    </div>

  </div>

  <!-- CIRCULAR -->
  <div *ngIf="variant === 'circular'" class="circular-name">
    {{ getConversationName() }}
  </div>

</div>
