<div class="video-container" (pointerup)="handleTap($event)">

  <video
    #video
    [src]="src"
    loop
    muted
    (timeupdate)="onTimeUpdate()"
  ></video>

  <!-- Loading -->
  <div class="loading" *ngIf="isLoading">
    <div class="spinner"></div>
  </div>

  <!-- Center play icon when paused -->
  <div class="overlay" *ngIf="isPaused && !isLoading">
    <span class="play-icon">▶</span>
  </div>

  <!-- Double tap like animation -->
  <div class="like-burst" *ngIf="showLike">❤️</div>

  <!-- Bottom controls -->
  <div class="controls">
    <div class="progress">
      <div class="bar" [style.width.%]="progress"></div>
    </div>

    <button class="mute-btn" (pointerup)="$event.stopPropagation(); toggleMute()">
      <mat-icon>{{isMuted ? 'volume_off' : 'volume_up'}}</mat-icon>

    </button>
  </div>

</div>
