<!-- POST -->
@if(type === 'post') {
<div class="post">
    <div class="header">
        <div class="avatar"></div>
        <div class="info">
            <div class="line short"></div>
            <div class="line smaller"></div>
        </div>
    </div>

    <div class="media"></div>

    <div class="actions">
        <div class="line"></div>
        <div class="line small"></div>
    </div>
</div>
}

<!-- USER -->
@if(type === 'user') {
<div class="user">
    <div class="avatar"></div>
    <div class="line short"></div>
</div>
}

<!-- STORY -->
@if(type === 'story') {
<div class="story">
    <div class="circle"></div>
</div>
}

<!-- GENERIC -->
@if(type === 'generic') {
<div class="generic" [style.width]="width" [style.height]="height">
</div>
}
