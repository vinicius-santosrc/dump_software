<div [class]="variant === 'default' ? 'conversation-item' : 'conversation-item-circular'" [ngClass]="[variant, selected ? 'selected' : '']" (click)="onClick()">

  <div class="avatar-wrapper">
    <app-avatar-item [user]="getConversationUser()" [src]="getConversationAvatar()" [width]="'52px'" [height]="'52px'" />

    <div class="check" *ngIf="selected">
      ✓
    </div>
  </div>

  <!-- DEFAULT -->
  <div *ngIf="variant === 'default'" class="conversation-item__content">

    <div class="top">
      <span class="name">{{ getConversationName() }}</span>
      <span class="time"></span>
    </div>

    <div class="bottom">
      <span class="last">
        <span *ngIf="isTyping()" class="typing">digitando...</span>
        <span *ngIf="!isTyping()" [style.fontWeight]="getUnreadCount() > 0 ? '600' : '500'">{{ getLastMessage() }}</span>
      </span>

      <span class="badge" *ngIf="getUnreadCount() > 0">
        {{ getUnreadCount() }}
      </span>
    </div>

  </div>

  <!-- CIRCULAR -->
  <div *ngIf="variant === 'circular'" class="circular-name">
    {{ getConversationName() }}
  </div>

</div>
