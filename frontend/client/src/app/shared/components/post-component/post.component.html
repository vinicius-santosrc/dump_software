<article>
    <div class="post-component-ref">
        <app-post-header [user]="post?.user" [post]="post" [caption]="post?.caption" />

        <app-post-media [media]="post?.media || []" [postId]="post?.id" (likeChanged)="onLikeChanged($event)" />

        <app-post-action-buttons [post]="post"/>

        <app-post-comments [comments]="post?.comments ?? []" />
    </div>
</article>
